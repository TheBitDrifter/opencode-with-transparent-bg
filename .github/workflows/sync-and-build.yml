name: Sync upstream & build

on:
  schedule:
    - cron: "0 6 * * *" # daily at 6am UTC
  workflow_dispatch: # manual trigger

jobs:
  sync-and-build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Sync upstream dev
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/anomalyco/opencode.git
          git fetch upstream dev

          if [ "$(git rev-parse HEAD)" = "$(git merge-base HEAD upstream/dev)" ] || git merge-base --is-ancestor upstream/dev HEAD; then
            echo "No upstream changes, skipping build."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

          # Keep our README on conflict, take upstream for everything else
          git merge upstream/dev --no-edit -X theirs || {
            # If conflict is only README, resolve with ours
            CONFLICTED=$(git diff --name-only --diff-filter=U)
            if echo "$CONFLICTED" | grep -qx "README.md" && [ "$(echo "$CONFLICTED" | wc -l)" -eq 1 ]; then
              git checkout --ours README.md
              git add README.md
              git commit --no-edit
            else
              echo "::error::Merge conflict — patch needs manual rebase"
              exit 1
            fi
          }
          git push origin dev

      - uses: oven-sh/setup-bun@v2
        if: steps.sync.outputs.changed == 'true'
        with:
          bun-version-file: package.json

      - name: Install & build
        if: steps.sync.outputs.changed == 'true'
        run: |
          bun install
          ./packages/opencode/script/build.ts --single

      - name: Get upstream version
        if: steps.sync.outputs.changed == 'true'
        id: version
        run: |
          VERSION=$(./packages/opencode/dist/opencode-darwin-arm64/bin/opencode --version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create/update release
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest"
          NOTES="Built from upstream + transparency patch on $(date -u +%Y-%m-%d)
          Version: ${{ steps.version.outputs.version }}"

          REPO="${{ github.repository }}"

          # Delete existing release if present
          gh release delete "$TAG" --repo "$REPO" --yes 2>/dev/null || true
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

          # Create new release
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "opencode (transparent)" \
            --notes "$NOTES" \
            --latest \
            ./packages/opencode/dist/opencode-darwin-arm64/bin/opencode
